version: '3.9'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - 8082:8082
    env_file:
      - .env
    environment:
      - SERVER_HOST=0.0.0.0
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_NAME=myDB
    depends_on:
      migrator:
        condition: service_completed_successfully
      db:
        condition: service_started

  migrator:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_NAME=myDB
    depends_on:
      db:
        condition: service_started
    command: ["/app/migration", "up"]

  db:
    image: postgres:15
    ports:
      - 5433:5432
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=myDB
    volumes:
      - db_data:/var/lib/postgresql/data

volumes:
  db_data: