version: '3.9'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - 8082:8082
    environment:
      - DB_HOST=db
      - DB_PORT=5433
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_NAME=myDB
    depends_on:
      - db
    volumes:
      - .:/app
    command: [ "go", "run", "./cmd/server/main.go" ]

  db:
    image: postgres:15
    ports:
      - 5433:5433
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=myDB
    volumes:
      - db_data:/var/lib/postgresql/data

volumes:
  db_data: